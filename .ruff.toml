# Advisory Python formatter/linter policy.
#
# The binding gate for new Python lines is scripts/check_source_style.py,
# which is dependency-free, added-lines-only and runs in `make check` and CI.
# This file configures ruff for developers who want whole-file formatting and
# linting. It is exposed through `make python-format-check` but is not binding
# yet: 59 existing files predate this configuration and must be reformatted in
# a dedicated PR before whole-tree ruff checks can be required.

line-length = 100
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
"**/tests/**" = ["E402"]
