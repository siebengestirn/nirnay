[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nirnay-quantlab"
version = "0.1.0"
description = "Reproducible quantitative research tools for the Nirnay workspace"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
quantlab = "quantlab.cli:main"
nirnay-risk-service = "quantlab.risk_daemon:main"

[project.optional-dependencies]
security = ["cryptography>=44.0"]
kms = ["cryptography>=44.0", "boto3>=1.36,<2"]
research = [
  "numpy>=2.0",
  "polars>=1.0",
  "pyarrow>=18.0",
  "duckdb>=1.1",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
]
dev = ["pytest>=8.0", "ruff>=0.8", "cryptography>=44.0", "jsonschema>=4.23"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
