name: Release
# Release assets are built from the tagged commit inside Actions, never uploaded
# from a developer machine, and carry a build-provenance attestation. A SHA-256
# sidecar proves the bytes travelled intact; the attestation is what ties those
# bytes to this repository, this commit and this workflow.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  bundle:
    name: source bundle and provenance (linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
      - name: Build wheels from the tagged commit
        run: |
          rm -rf build dist research/python/build apps/kite-ops/build apps/fyers-recorder/build
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m pip install --disable-pip-version-check build
          python -m build --wheel research/python --outdir dist
          python -m build --wheel apps/kite-ops --outdir dist
          python -m build --wheel apps/fyers-recorder --outdir dist
          python scripts/check_wheels.py --dist dist
      - name: Build release binaries from the tagged commit
        run: cargo build --release --locked --bins
      - name: Assemble the artifact directory
        run: |
          mkdir -p artifacts
          cp dist/*.whl artifacts/
          for bin in upstox-smoke upstox-recorder upstox-decode-export; do
            cp "target/release/$bin" "artifacts/$bin"
          done
          (cd artifacts && shasum -a 256 ./* > SHA256SUMS && cat SHA256SUMS)
      - name: Generate the SBOM from this commit's manifests
        run: python scripts/supply_chain.py sbom sbom.cdx.json
      - name: Assemble the reproducible source bundle
        run: |
          python scripts/make_bundle.py \
            --source-dir . \
            --artifacts artifacts \
            --output "nirnay-quant-${GITHUB_REF_NAME}.zip"
      - name: Verify the bundle the way a consumer would
        run: |
          rm -rf consumer-check && mkdir consumer-check && cd consumer-check
          unzip -q "../nirnay-quant-${GITHUB_REF_NAME}.zip"
          python ../scripts/verify_bundle.py --bundle . --zip "../nirnay-quant-${GITHUB_REF_NAME}.zip"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nirnay-quant-*.zip
            artifacts/*.whl
            artifacts/upstox-*
            sbom.cdx.json
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "nirnay-quant-${GITHUB_REF_NAME}.zip" \
            "nirnay-quant-${GITHUB_REF_NAME}.zip.sha256" \
            SOURCE-MANIFEST.sha256 \
            sbom.cdx.json \
            artifacts/SHA256SUMS \
            artifacts/*.whl \
            artifacts/upstox-* \
            --clobber
  macos-assets:
    name: macOS binaries and provenance (arm64)
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
      - name: Verify Apple silicon runner
        run: test "$(uname -m)" = "arm64"
      # Suffixed so macOS and Linux assets never overwrite each other in the release.
      - name: Build macOS release binaries from the tagged commit
        run: |
          cargo build --release --locked --bins
          mkdir -p artifacts
          for bin in upstox-smoke upstox-recorder upstox-decode-export; do
            cp "target/release/$bin" "artifacts/$bin-macos-arm64"
          done
      - name: Compile the Keychain helper from the bundled Swift source
        run: |
          xcrun swiftc -O apps/kite-ops/src/kite_ops/native/keychain.swift -o artifacts/nirnay-keychain-helper
          lipo -archs artifacts/nirnay-keychain-helper
          (cd artifacts && shasum -a 256 ./* > SHA256SUMS-macos-arm64)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/upstox-*-macos-arm64
            artifacts/nirnay-keychain-helper
      - name: Publish macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/SHA256SUMS-macos-arm64 \
            artifacts/nirnay-keychain-helper \
            artifacts/upstox-*-macos-arm64 \
            --clobber
